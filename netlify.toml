# Netlify configuration for Stasht Studio
# This enables prerendering for better social media sharing

[build]
  command = "npm run build:prod"
  publish = "dist"

# Prerender specific routes for social media crawlers
[[plugins]]
  package = "@netlify/plugin-lighthouse"

# Prerendering for social media bots
[[plugins]]
  package = "netlify-plugin-prerender-spa"

# Redirect rules
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  # Don't apply this redirect to actual files
  force = false

# Headers for better caching and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
