<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Contact us</title>
    <style>
      /* Layout and look follow Chris's ContactWidget frames (Stasht Design Kit, Figma), scaled up ~12% (Chris, 2026-09-28). */
      :root { --brand: #6C60FF; --brand-ink: #ffffff; --panel-w: 420px; --panel-max-h: 696px; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; }
      body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1f2937; }
      /* Padding is ROOT_PAD in widget-core.js (applied by widget-embed.js); this is the no-JS fallback. */
      #root { display: inline-block; width: max-content; padding: 12px 16px 24px; }
      button { font: inherit; }
      button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

      /* ---- Closed: callout card + round launcher ---- */
      .closed { display: flex; flex-direction: column; align-items: flex-end; }
      .closed.left { align-items: flex-start; }
      .callout { position: relative; width: min(316px, var(--panel-w)); /* --panel-w fits the phone's width */ margin-bottom: 16px; padding: 16px 18px 18px; background: #fff; border-radius: 16px;
        box-shadow: 0 0 0 1px rgba(16, 24, 40, .05), 0 6px 16px -4px rgba(16, 24, 40, .18); }
      .callout::after { content: ''; position: absolute; bottom: -7px; right: 24px; width: 14px; height: 14px; background: #fff;
        transform: rotate(45deg); box-shadow: 3px 3px 4px -2px rgba(16, 24, 40, .10); }
      .closed.left .callout::after { right: auto; left: 24px; }
      .callout-body { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; color: inherit; }
      .callout .team { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
      .callout .count { font-size: 13.5px; font-weight: 600; color: #16a34a; }
      .callout .title { display: block; padding-right: 20px; font-size: 17px; font-weight: 700; color: #111827; }
      .callout .sub { display: block; margin-top: 3px; font-size: 15px; color: #4b5563; }
      .dismiss { position: absolute; top: 9px; right: 9px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: none;
        color: #9ca3af; font-size: 20px; line-height: 1; cursor: pointer; }
      .dismiss:hover { background: #f3f4f6; color: #4b5563; }
      .launcher { display: flex; align-items: center; justify-content: center; width: 62px; height: 62px; border: 0; border-radius: 50%;
        background: var(--brand); color: var(--brand-ink); cursor: pointer;
        box-shadow: 0 6px 16px -2px color-mix(in srgb, var(--brand) 55%, transparent); }
      .launcher svg { width: 28px; height: 28px; }

      /* Online faces (callout) */
      .faces { display: flex; }
      .face { position: relative; width: 32px; height: 32px; margin-left: -8px; border-radius: 50%; border: 2px solid #fff; background: #fff; }
      .face:first-child { margin-left: 0; }
      .face:nth-child(1) { z-index: 4; } .face:nth-child(2) { z-index: 3; } .face:nth-child(3) { z-index: 2; } .face:nth-child(4) { z-index: 1; }
      .face img, .face .ini { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;
        border-radius: 50%; object-fit: cover; font-size: 11.5px; font-weight: 700; }
      .face .dot { position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%; background: #22c55e; border: 2px solid #fff; }

      /* ---- Open panel ---- */
      .panel { width: var(--panel-w); background: #fff; border-radius: 18px; max-height: var(--panel-max-h); overflow-x: hidden; overflow-y: auto;
        box-shadow: 0 0 0 1px rgba(16, 24, 40, .06), 0 8px 20px -6px rgba(16, 24, 40, .28), 0 2px 6px rgba(16, 24, 40, .08); }
      .head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 16px 14px 16px 18px;
        background: var(--brand); color: var(--brand-ink); }
      .hav { position: relative; flex: none; width: 42px; height: 42px; border-radius: 50%; }
      .hav img, .hav .icon { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border-radius: 50%;
        object-fit: cover; background: rgba(255, 255, 255, .22); }
      .hav svg { width: 21px; height: 21px; }
      .hav .dot { position: absolute; top: -1px; right: -1px; width: 12px; height: 12px; border-radius: 50%; background: #22c55e; border: 2px solid var(--brand); }
      .who { min-width: 0; }
      .who h2 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .who p { display: flex; align-items: center; gap: 6px; margin: 2px 0 0; font-size: 14px; opacity: .92; }
      .who p .on { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
      .iconbtn { flex: none; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 0; border-radius: 50%;
        background: transparent; color: inherit; cursor: pointer; }
      .iconbtn:hover { background: rgba(255, 255, 255, .18); }
      .iconbtn svg { width: 22px; height: 22px; }
      .head .close { margin-left: auto; }

      .body { display: grid; gap: 14px; padding: 18px; }
      .row { display: flex; align-items: flex-start; gap: 12px; }
      .row.me { justify-content: flex-end; }
      .mini { flex: none; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%;
        background: var(--brand); color: var(--brand-ink); overflow: hidden; }
      .mini svg { width: 16px; height: 16px; }
      .mini img { width: 100%; height: 100%; object-fit: cover; }
      .row.me .mini { background: #e5e7eb; color: #6b7280; font-size: 12px; font-weight: 700; margin-top: auto; }
      .row.bot .mini { margin-top: auto; }
      .row.bot.top .mini { margin-top: 0; }
      .stack { display: grid; gap: 4px; max-width: 82%; }
      .row.me .stack { justify-items: end; }
      .bubble { padding: 12px 16px; border-radius: 16px; background: #f3f4f6; color: #1f2937; font-size: 16px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
      .row.me .bubble { background: var(--brand); color: var(--brand-ink); }
      .time { font-size: 12px; color: #9ca3af; }

      form { display: grid; gap: 12px; }
      input, textarea { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 11px; background: #fff; color: #1f2937; font: inherit; font-size: 16px; }
      input::placeholder, textarea::placeholder { color: #9ca3af; }
      textarea { min-height: 96px; resize: vertical; }
      .err { color: #b3261e; font-size: 13px; font-weight: 500; margin-top: -4px; }
      .legal { margin: 2px 0 0; font-size: 12.5px; line-height: 1.5; color: #6b7280; }
      .send { height: 48px; border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-ink); font-size: 16px; font-weight: 600; cursor: pointer; }
      .send[disabled] { opacity: .45; cursor: default; }

      /* ---- Live chat (spec 2026-09-29): the same bubbles and avatars, plus a typing box ---- */
      .panel.chat { display: flex; flex-direction: column; height: min(var(--panel-max-h), 620px); overflow: hidden; }
      .log { flex: 1; min-height: 0; overflow-y: auto; align-content: start; overscroll-behavior: contain; }
      .mini.ini { font-size: 12px; font-weight: 700; }
      .row.me .mini svg { width: 16px; height: 16px; }
      .atts { display: grid; gap: 6px; }
      .row.me .atts { justify-items: end; }
      .att-img { display: block; width: 200px; max-width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid #e5e7eb; background: #f3f4f6; }
      .att-img img { display: block; width: 100%; max-height: 240px; object-fit: cover; }
      .att-file { display: flex; align-items: center; gap: 10px; max-width: 240px; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 14px;
        background: #fff; color: #1f2937; font-size: 14px; font-weight: 500; text-decoration: none; }
      .att-file:hover { background: #f9fafb; }
      .ficon { flex: none; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: #fef2f2; color: #ef4444; }
      .ficon svg { width: 18px; height: 18px; }
      .fname, .cname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .composer { flex: none; padding: 10px 12px 12px; border-top: 1px solid #eef0f3; background: #fff; }
      .queue { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
      .chip { position: relative; display: flex; align-items: center; gap: 8px; max-width: 100%; padding: 5px 32px 5px 5px; border-radius: 12px;
        background: #f3f4f6; font-size: 13.5px; color: #374151; }
      .chip img, .chip .ficon { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
      .chip .x { position: absolute; top: 50%; right: 5px; transform: translateY(-50%); width: 24px; height: 24px; border: 0; border-radius: 50%;
        background: none; color: #6b7280; font-size: 18px; line-height: 1; cursor: pointer; }
      .chip .x:hover { background: #e5e7eb; color: #1f2937; }
      .bar { display: flex; align-items: flex-end; gap: 6px; }
      .bar textarea { flex: 1; min-height: 46px; max-height: 128px; padding: 12px 16px; border-radius: 23px; resize: none; line-height: 1.35; overflow-y: auto; }
      .clip, .sendbtn { flex: none; display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border: 0; border-radius: 50%; cursor: pointer; }
      .clip { background: none; color: #6b7280; }
      .clip:hover { background: #f3f4f6; color: #374151; }
      .sendbtn { background: var(--brand); color: var(--brand-ink); }
      .sendbtn[disabled], .clip[disabled] { opacity: .45; cursor: default; }
      .clip svg, .sendbtn svg { width: 22px; height: 22px; }
      .composer .err { margin: 8px 4px 0; }

      /* "Powered by Stasht" foot of the open panel (Chris, 2026-10-02) */
      .powered { flex: none; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 2px 0 13px;
        font-size: 12.5px; color: #9ca3af; text-decoration: none; }
      .powered svg { width: 18px; height: 12px; }
      .powered strong { color: #4b5563; font-weight: 700; }
      .powered:hover strong { color: #6C60FF; }
      .panel:not(.chat) .powered { padding-top: 0; margin-top: -4px; }

      /* Unread dot on the closed launcher */
      .launcher { position: relative; }
      .launcher .unread { position: absolute; top: 1px; right: 1px; width: 16px; height: 16px; border-radius: 50%; background: #ef4444; border: 2.5px solid #fff; }

      /* ---- Widget AI (spec 2026-09-29 part 2): notice, "AI" tag, typing dots, campaign card, rep joined ---- */
      .sys { justify-self: center; max-width: 92%; margin: 2px 0; padding: 8px 14px; border-radius: 12px;
        background: color-mix(in srgb, var(--brand) 7%, #fff); color: #4b5563; font-size: 13px; line-height: 1.45; text-align: center; }
      .sys.joined { background: transparent; padding: 2px 14px; color: #6b7280; font-size: 12.5px; font-weight: 500; }
      .ai-tag { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 6px; vertical-align: 1px;
        background: color-mix(in srgb, var(--brand) 12%, #fff); color: var(--brand); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; }
      .bubble.typing { display: inline-flex; align-items: center; gap: 5px; width: max-content; padding: 16px 18px; }
      .tdot { width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; animation: tdot 1.2s infinite ease-in-out; }
      .tdot:nth-child(2) { animation-delay: .15s; }
      .tdot:nth-child(3) { animation-delay: .3s; }
      @keyframes tdot { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
      @media (prefers-reduced-motion: reduce) { .tdot { animation: none; opacity: .6; } }
      .row.me.pending .stack { opacity: .7; }
      .camp { display: flex; align-items: center; gap: 12px; width: 264px; max-width: 100%; padding: 12px 12px 12px 14px; border: 1px solid #e5e7eb;
        border-radius: 14px; background: #fff; color: #1f2937; text-decoration: none; box-shadow: 0 1px 2px rgba(16, 24, 40, .05); }
      .camp:hover { background: #f9fafb; }
      .camp-icon { flex: none; display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px;
        background: color-mix(in srgb, var(--brand) 12%, #fff); color: var(--brand); }
      .camp-icon svg { width: 20px; height: 20px; }
      .camp-text { display: grid; gap: 2px; flex: 1; min-width: 0; }
      .camp-title { font-size: 15px; font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .camp-cta { font-size: 13.5px; font-weight: 600; color: var(--brand); }
      .camp-go { flex: none; display: flex; color: #9ca3af; }
      .camp-go svg { width: 18px; height: 18px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/widget-embed.js"></script>
  </body>
</html>
