<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Contact us</title>
    <style>
      /* Layout and look follow Chris's ContactWidget frames (Stasht Design Kit, Figma). */
      :root { --brand: #6C60FF; --brand-ink: #ffffff; --panel-w: 380px; --panel-max-h: 696px; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; }
      body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1f2937; }
      /* Padding is ROOT_PAD in widget-core.js (applied by widget-embed.js); this is the no-JS fallback. */
      #root { display: inline-block; width: max-content; padding: 12px 16px 24px; }
      button { font: inherit; }
      button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

      /* ---- Closed: callout card + round launcher ---- */
      .closed { display: flex; flex-direction: column; align-items: flex-end; }
      .closed.left { align-items: flex-start; }
      .callout { position: relative; width: 280px; margin-bottom: 14px; padding: 14px 16px 16px; background: #fff; border-radius: 14px;
        box-shadow: 0 0 0 1px rgba(16, 24, 40, .05), 0 6px 16px -4px rgba(16, 24, 40, .18); }
      .callout::after { content: ''; position: absolute; bottom: -6px; right: 22px; width: 12px; height: 12px; background: #fff;
        transform: rotate(45deg); box-shadow: 3px 3px 4px -2px rgba(16, 24, 40, .10); }
      .closed.left .callout::after { right: auto; left: 22px; }
      .callout-body { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; color: inherit; }
      .callout .team { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .callout .count { font-size: 12px; font-weight: 600; color: #16a34a; }
      .callout .title { display: block; padding-right: 18px; font-size: 15px; font-weight: 700; color: #111827; }
      .callout .sub { display: block; margin-top: 2px; font-size: 13px; color: #4b5563; }
      .dismiss { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border: 0; border-radius: 50%; background: none;
        color: #9ca3af; font-size: 18px; line-height: 1; cursor: pointer; }
      .dismiss:hover { background: #f3f4f6; color: #4b5563; }
      .launcher { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border: 0; border-radius: 50%;
        background: var(--brand); color: var(--brand-ink); cursor: pointer;
        box-shadow: 0 6px 16px -2px color-mix(in srgb, var(--brand) 55%, transparent); }
      .launcher svg { width: 26px; height: 26px; }

      /* Online faces (callout) */
      .faces { display: flex; }
      .face { position: relative; width: 28px; height: 28px; margin-left: -7px; border-radius: 50%; border: 2px solid #fff; background: #fff; }
      .face:first-child { margin-left: 0; }
      .face:nth-child(1) { z-index: 4; } .face:nth-child(2) { z-index: 3; } .face:nth-child(3) { z-index: 2; } .face:nth-child(4) { z-index: 1; }
      .face img, .face .ini { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;
        border-radius: 50%; object-fit: cover; font-size: 10px; font-weight: 700; }
      .face .dot { position: absolute; right: -2px; bottom: -2px; width: 9px; height: 9px; border-radius: 50%; background: #22c55e; border: 2px solid #fff; }

      /* ---- Open panel ---- */
      .panel { width: var(--panel-w); background: #fff; border-radius: 16px; max-height: var(--panel-max-h); overflow-x: hidden; overflow-y: auto;
        box-shadow: 0 0 0 1px rgba(16, 24, 40, .06), 0 8px 20px -6px rgba(16, 24, 40, .28), 0 2px 6px rgba(16, 24, 40, .08); }
      .head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 14px 12px 14px 16px;
        background: var(--brand); color: var(--brand-ink); }
      .hav { position: relative; flex: none; width: 36px; height: 36px; border-radius: 50%; }
      .hav img, .hav .icon { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border-radius: 50%;
        object-fit: cover; background: rgba(255, 255, 255, .22); }
      .hav svg { width: 18px; height: 18px; }
      .hav .dot { position: absolute; top: -1px; right: -1px; width: 11px; height: 11px; border-radius: 50%; background: #22c55e; border: 2px solid var(--brand); }
      .who { min-width: 0; }
      .who h2 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .who p { display: flex; align-items: center; gap: 6px; margin: 2px 0 0; font-size: 12.5px; opacity: .92; }
      .who p .on { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; }
      .iconbtn { flex: none; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0; border-radius: 50%;
        background: transparent; color: inherit; cursor: pointer; }
      .iconbtn:hover { background: rgba(255, 255, 255, .18); }
      .iconbtn svg { width: 20px; height: 20px; }
      .head .close { margin-left: auto; }

      .body { display: grid; gap: 12px; padding: 16px; }
      .row { display: flex; align-items: flex-start; gap: 10px; }
      .row.me { justify-content: flex-end; }
      .mini { flex: none; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%;
        background: var(--brand); color: var(--brand-ink); overflow: hidden; }
      .mini svg { width: 14px; height: 14px; }
      .mini img { width: 100%; height: 100%; object-fit: cover; }
      .row.me .mini { background: #e5e7eb; color: #6b7280; font-size: 11px; font-weight: 700; margin-top: auto; }
      .row.bot .mini { margin-top: auto; }
      .row.bot.top .mini { margin-top: 0; }
      .stack { display: grid; gap: 4px; max-width: 82%; }
      .row.me .stack { justify-items: end; }
      .bubble { padding: 11px 14px; border-radius: 14px; background: #f3f4f6; color: #1f2937; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
      .row.me .bubble { background: var(--brand); color: var(--brand-ink); }
      .time { font-size: 11px; color: #9ca3af; }

      form { display: grid; gap: 10px; }
      input, textarea { width: 100%; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 10px; background: #fff; color: #1f2937; font: inherit; font-size: 14.5px; }
      input::placeholder, textarea::placeholder { color: #9ca3af; }
      textarea { min-height: 88px; resize: vertical; }
      .err { color: #b3261e; font-size: 12px; font-weight: 500; margin-top: -4px; }
      .legal { margin: 2px 0 0; font-size: 11.5px; line-height: 1.5; color: #6b7280; }
      .send { height: 44px; border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-ink); font-weight: 600; cursor: pointer; }
      .send[disabled] { opacity: .45; cursor: default; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/widget-embed.js"></script>
  </body>
</html>
